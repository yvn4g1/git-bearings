name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:git-executor
      - run: npm run test:core-reader
      - run: npm run test:repository-selection
      - run: npm run test:supplemental-reader
      - run: npm run test:comparison
      - run: npm run test:sidebar
      - run: npm run test:overview
      - run: npm run test:explanation
      - run: npm run test:commit-detail
      - run: npm run test:command-parser
      - run: npm run test:command-simulator
      - run: npm run test:git-map
      - run: npm run test:command-preview
      - run: npm run test:goal
      - run: npm run test:refresh
      - run: npm run test:hardening
      - name: Package VSIX
        run: npx --yes @vscode/vsce package --out git-bearings-ci.vsix
      - name: Verify VSIX contents
        shell: bash
        run: |
          unzip -Z1 git-bearings-ci.vsix | tee vsix-files.txt
          grep -qx 'extension/package.json' vsix-files.txt
          grep -qx 'extension/README.md' vsix-files.txt
          grep -qx 'extension/out/extension.js' vsix-files.txt
          if grep -Eq '^extension/(src|docs|\.github|\.vscode)/' vsix-files.txt; then
            echo 'Source/development directories must not be packaged.' >&2
            exit 1
          fi
          if grep -Eq '^extension/out/.*(\.test\.js|\.map)$' vsix-files.txt; then
            echo 'Tests/source maps must not be packaged.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: git-bearings-vsix
          path: git-bearings-ci.vsix
          if-no-files-found: error
