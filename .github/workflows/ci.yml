name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:git-executor
      - run: npm run test:core-reader
      - run: npm run test:repository-selection
      - run: npm run test:supplemental-reader
      - run: npm run test:comparison
      - run: npm run test:sidebar
      - run: npm run test:overview
      - run: npm run test:explanation
      - run: npm run test:commit-detail
      - run: npm run test:command-parser
      - run: npm run test:command-simulator
      - run: npm run test:git-map
      - run: npm run test:command-preview
      - run: npm run test:goal
      - run: npm run test:refresh
      - run: npm run test:hardening
      - name: Package VSIX
        run: npx --yes @vscode/vsce package --out git-bearings-0.1.0.vsix
      - name: Verify VSIX contents
        shell: bash
        run: |
          unzip -Z1 git-bearings-0.1.0.vsix | tee vsix-files.txt
          grep -qx 'extension/package.json' vsix-files.txt
          grep -Eiq '^extension/readme\.md$' vsix-files.txt
          grep -Eiq '^extension/license(\.txt)?$' vsix-files.txt
          grep -qx 'extension/out/extension.js' vsix-files.txt
          grep -qx 'extension/docs/images/overview.png' vsix-files.txt

          if grep -Eq '^extension/(src|\.github|\.vscode)/' vsix-files.txt; then
            echo 'Source/development directories must not be packaged.' >&2
            exit 1
          fi

          unexpected_docs="$(grep -E '^extension/docs/' vsix-files.txt | grep -v '^extension/docs/images/overview.png$' || true)"
          if [ -n "$unexpected_docs" ]; then
            echo 'Only docs/images/overview.png may be packaged from docs/.' >&2
            printf '%s\n' "$unexpected_docs" >&2
            exit 1
          fi

          if grep -Eq '^extension/out/.*(\.test\.js|\.type-test\.js|\.map)$' vsix-files.txt; then
            echo 'Tests/type-tests/source maps must not be packaged.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: git-bearings-v0.1.0-vsix
          path: git-bearings-0.1.0.vsix
          if-no-files-found: error
